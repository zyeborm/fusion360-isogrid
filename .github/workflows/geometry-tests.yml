name: Pure Python geometry tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run geometry regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
