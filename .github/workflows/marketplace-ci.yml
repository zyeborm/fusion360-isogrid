name: Marketplace startup and regression tests
on:
  push:
    branches: [marketplace]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  startup-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cold and repeated startup
        run: python benchmark_startup.py
      - name: Install test-only polygon oracle
        run: python -m pip install shapely
      - name: Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Read application version
        id: version
        run: echo "version=$(python -c 'import json; print(json.load(open("fusion360-isogrid.manifest"))["version"])')" >> "$GITHUB_OUTPUT"
      - name: Build and verify both distribution packages
        run: python tools/build_release.py --version "${{ steps.version.outputs.version }}"
      - name: Save installable packages and icon
        uses: actions/upload-artifact@v4
        with:
          name: fusion360-isogrid-distributions
          path: dist/*
          if-no-files-found: error
