name: Marketplace startup and regression tests
on:
  push:
    branches: [marketplace]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  startup-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cold and repeated startup
        run: python benchmark_startup.py
      - name: Install test-only polygon oracle
        run: python -m pip install shapely
      - name: Python regression suite
        run: python -m unittest discover -s tests -v
